<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AnshaMart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">AnshaMart</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="orders.html">Orders</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html" class="cart-link">
                Cart <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>Login to your AnshaMart account</p>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="login-message"></p>

            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </main>

    <footer>

        <div class="footer-logo">AnshaMart</div>

        <p>Your everyday online shopping destination.</p>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </div>

        <p class="copyright">© 2026 AnshaMart. All rights reserved.</p>

    </footer>

    <script src="js/auth.js"></script>

</body>

</html>
